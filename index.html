<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISKL Dictation Recorder</title>
<style>
  :root {
    --navy: #002B49;
    --gold: #F5B800;
    --border: #E4E9EE;
    --muted: #64748B;
    --live: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F3F5F7;
    color: #1A202C;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 18px 40px -18px rgba(0,43,73,0.18);
  }
  h1 { font-size: 1.05rem; color: var(--navy); margin: 0 0 4px; }
  p.sub { font-size: 0.85rem; color: var(--muted); margin: 0 0 22px; }
  .mic-circle {
    width: 88px; height: 88px;
    border-radius: 50%;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy);
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    border: none;
    transition: background-color 0.15s ease;
  }
  .mic-circle.recording {
    background: var(--live);
    animation: pulse 1.6s infinite;
  }
  .mic-circle:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229,72,77,0.5); }
    70% { box-shadow: 0 0 0 16px rgba(229,72,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); }
  }
  #status { font-weight: 600; font-size: 0.9rem; margin-bottom: 14px; color: var(--navy); }
  textarea {
    width: 100%; min-height: 120px;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px; font-size: 0.9rem; resize: vertical;
    line-height: 1.5;
  }
  .btn {
    border: none; border-radius: 10px; padding: 10px 18px;
    font-weight: 700; font-size: 0.88rem; cursor: pointer;
    margin-top: 12px; width: 100%;
  }
  .btn-navy { background: var(--navy); color: #fff; }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 0.76rem; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  .error { color: var(--live); font-size: 0.82rem; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>ISKL dictation</h1>
    <p class="sub">Tap the mic and speak — your words appear live in the minutes form, no need to send.</p>

    <button class="mic-circle" id="micBtn" aria-label="Start dictation">
      <span id="micGlyph">&#127908;</span>
    </button>

    <div id="status">Tap to start</div>

    <textarea id="resultBox" placeholder="Your dictated notes will appear here. You can also edit them by hand before sending."></textarea>

    <button class="btn btn-navy" id="sendBtn">Send typed text (if you edited manually)</button>
    <button class="btn btn-gold" id="copyBtn">Copy text instead</button>

    <div class="error" id="errorMsg"></div>
    <div class="hint" id="hintMsg"></div>
  </div>

<script>
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = !!SpeechRecognitionAPI;

  const micBtn = document.getElementById('micBtn');
  const micGlyph = document.getElementById('micGlyph');
  const statusEl = document.getElementById('status');
  const resultBox = document.getElementById('resultBox');
  const sendBtn = document.getElementById('sendBtn');
  const copyBtn = document.getElementById('copyBtn');
  const errorMsg = document.getElementById('errorMsg');
  const hintMsg = document.getElementById('hintMsg');

  const openedByParent = !!window.opener;
  copyBtn.style.display = openedByParent ? 'none' : 'block';
  sendBtn.style.display = openedByParent ? 'block' : 'none';
  hintMsg.textContent = openedByParent
    ? 'Spoken words are sent to your minutes form automatically as you talk. If you type or edit text here by hand, tap "Send typed text" to add it too.'
    : 'Tip: open this page from the "Start Dictation" button in the minutes form so your text is sent back automatically. Since it wasn\u2019t opened that way, use "Copy text instead."';

  if (!supported) {
    micBtn.disabled = true;
    statusEl.textContent = 'Dictation not supported here';
    errorMsg.textContent = 'This browser doesn\u2019t support built-in dictation. Try Chrome, Edge, or Safari \u2014 or just type your notes directly in the box below and send them.';
    errorMsg.style.display = 'block';
  }

  let recognition = null;
  let isRecording = false;
  let userStopped = false;
  let baseText = '';
  let interimText = '';
  let sentUpToLength = 0;

  function updateBox() {
    resultBox.value = baseText + interimText;
  }

  micBtn.addEventListener('click', () => {
    if (!supported) return;
    if (isRecording) {
      userStopped = true;
      recognition.stop();
    } else {
      startDictation();
    }
  });

  function startDictation() {
    errorMsg.style.display = 'none';
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;

    baseText = resultBox.value;
    if (baseText && !/\s$/.test(baseText)) baseText += ' ';
    interimText = '';
    userStopped = false;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      micGlyph.textContent = '\u25a0';
      statusEl.textContent = 'Listening\u2026 tap to stop';
    };

    recognition.onresult = (event) => {
      let finalChunk = '';
      let interimChunk = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalChunk += transcript + ' ';
        else interimChunk += transcript;
      }
      if (finalChunk) {
        baseText += finalChunk;
        sentUpToLength = baseText.length;
        if (openedByParent) window.opener.postMessage({ type: 'iskl-transcript-final', text: finalChunk }, '*');
      }
      interimText = interimChunk;
      updateBox();
      if (openedByParent) window.opener.postMessage({ type: 'iskl-transcript-interim', text: interimText }, '*');
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech') return;
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        userStopped = true;
        errorMsg.textContent = 'Microphone access was blocked. Check your browser permission for this site and try again.';
        errorMsg.style.display = 'block';
      }
    };

    recognition.onend = () => {
      if (!userStopped) {
        try { recognition.start(); } catch (e) { /* already starting */ }
      } else {
        isRecording = false;
        micBtn.classList.remove('recording');
        micGlyph.textContent = '\uD83C\uDFA4';
        statusEl.textContent = 'Tap to start';
      }
    };

    recognition.start();
  }

  sendBtn.addEventListener('click', () => {
    const fullText = resultBox.value;
    const unsent = fullText.slice(sentUpToLength).trim();
    if (!unsent) {
      errorMsg.textContent = 'Nothing new to send \u2014 spoken text is already sent automatically as you talk.';
      errorMsg.style.display = 'block';
      return;
    }
    if (openedByParent) {
      window.opener.postMessage({ type: 'iskl-transcript-final', text: unsent + ' ' }, '*');
      sentUpToLength = fullText.length;
      statusEl.textContent = 'Sent';
      errorMsg.style.display = 'none';
    }
  });

  copyBtn.addEventListener('click', () => {
    resultBox.select();
    document.execCommand('copy');
    copyBtn.textContent = 'Copied!';
    setTimeout(() => (copyBtn.textContent = 'Copy text instead'), 1500);
  });
</script>
</body>
</html>
